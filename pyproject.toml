[project]
name = "prometheus"
version = "0.1.0"
description = "A multi-agent framework for human-centric research and investigation"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.54",
    "streamlit>=1.64.0",
    # "langgraph",
    # "langchain-openai",
    # "openai",
    # "langsmith",
    # "qdrant-client",        # uncomment if VECTOR_DB_BACKEND=qdrant
    # "ragas",
    # "mcp",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"
