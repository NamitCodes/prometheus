[project]
name = "prometheus"
version = "0.1.0"
description = "A multi-agent framework for human-centric research and investigation"
requires-python = ">=3.12"
dependencies = [

    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "openai>=1.40",
    "langsmith>=0.1",
    "chromadb>=0.5",
    # "qdrant-client>=1.9",        # uncomment if VECTOR_DB_BACKEND=qdrant
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",  # cross-encoder reranker + embeddings
    "pymupdf>=1.24",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "ragas>=0.1",
    "streamlit>=1.37",
    "mcp>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "typer>=0.12",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.0",
    "ddgs>=9.0",
    "beautifulsoup4>=4.12",

]

[project.scripts]
research = "prometheus.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]

requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

