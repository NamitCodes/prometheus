[project]
name = "prometheus"
version = "0.1.0"
description = "A multi-agent framework for human-centric research and investigation"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "anthropic>=0.34",
    "langsmith>=0.1",
    "chromadb>=0.5",
    # "qdrant-client>=1.9",        # uncomment if VECTOR_DB_BACKEND=qdrant
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",  # cross-encoder reranker + embeddings
    "pymupdf>=1.24",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "ragas>=0.1",
    "streamlit>=1.37",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
